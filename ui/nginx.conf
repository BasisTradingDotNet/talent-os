server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Cloudflare Access bypasses /c/*, /api/candidate/* and /assets/* by path. Refuse anything
    # nginx would normalise into a different path (encoded slashes/dots, backslashes, dot
    # segments), so the path Access judged is always the path the API serves.
    if ($request_uri ~* "(%2f|%5c|%2e|\\|/\.\.?(/|\?|$))") {
        return 400;
    }

    # SPA: unknown paths are client-side routes, not 404s. Never cache the shell.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # PUBLIC (Access bypass): the token-gated candidate view. Strip any identity headers a client
    # might forge — this path must never carry an interviewer identity.
    location /api/candidate/ {
        proxy_pass http://api:4310/api/candidate/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cf-Access-Authenticated-User-Email "";
        proxy_set_header Cf-Access-Jwt-Assertion "";
        proxy_read_timeout 30s;
    }

    # Same origin for the API; Cloudflare Access headers pass through unchanged.
    location /api/ {
        proxy_pass http://api:4310/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # Hashed build output only lives here; safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
