server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # SPA: unknown paths are client-side routes, not 404s. Never cache the shell.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Same origin for the API; Cloudflare Access headers pass through unchanged.
    location /api/ {
        proxy_pass http://api:4310/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # Hashed build output only lives here; safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
